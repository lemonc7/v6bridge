setting:
  session_timeout: 120
  cleanup_interval: 30
  socket_buf_size: 4
  packet_buffer_size: 64

tunnels:
  - host: "game.example.com"
    services:
      - name: "mc"
        remote: 25565
        local: 25565
        proto: "tcp"

      - name: "帕鲁"
        remote: 8211
        local: 8211
        proto: "udp"

      - name: "teamspeak"
        remote: 9987
        local: 9987
        proto: "udp"

  - host: "2001:db8:a0b:1234::100"
    services:
      - name: "ipv6"
        remote: 222
        local: 333
        proto: "udp"

  - host: "192.168.100.1"
    services:
      - name: "ipv4"
        remote: 444
        local: 444
        proto: "tcp"
